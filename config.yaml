# ============================================================================
# coupang-deal-bot 설정 파일
# 비밀값(API 키, 토큰)은 여기에 쓰지 말고 .env / 환경변수로 관리합니다.
# 값을 바꾼 뒤에는 봇을 재시작하세요.
# ============================================================================

app:
  timezone: Asia/Seoul
  log_level: INFO
  scheduler_tick_seconds: 30
  prune_price_history_days: 180
  prune_events_days: 30

# 쿠팡파트너스 API 호출 예산 (시간당). 검색 API 기준 시간당 10회 제한이 알려져 있어 보수적으로 잡음.
# 문서에서 더 높은 한도를 확인하면 올리세요. 0 = 무제한.
coupang:
  max_calls_per_hour: 10
  deeplink_reserve: 3          # 발행용 딥링크 호출을 위해 항상 남겨 둘 몫
  deeplink_max_per_hour: 7     # 딥링크는 시간당 이만큼까지만 (골드박스·시중가 조회 몫을 남김). 넘치는 쿠팡 딜은 다음 시간에 올라감

# 네이버 쇼핑커넥트 브라우저 자동화 (선택). 켜면 /naverlogin 으로 QR 로그인 후 네이버 딜 링크를 자동 생성 시도,
# 실패하면 수동(관리자 링크) 으로 넘어감. 아래 shops 에서 naver 를 link_mode: api 로 바꿔야 동작.
browser:
  enabled: false
  headless: true
  profile_dir: browser-profile
  naver_connect:
    login_url: https://nid.naver.com/nidlogin.login
    create_url: https://connect.naver.com/     # 실제 링크 생성 페이지 주소로 수정 필요 (/shot 으로 확인)
    selectors:
      qr_tab: "text=QR코드"
      url_input: "input[type='url'], input[placeholder*='URL'], input[placeholder*='주소'], input[type='text']"
      create_button: "text=링크 발급"
      result: "input[readonly], textarea[readonly], a[href*='naver.me'], a[href*='connect']"

http:
  timeout_seconds: 20
  max_retries: 3
  retry_backoff_seconds: 2
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

# ----------------------------------------------------------------------------
# 쇼핑몰별 링크 처리. 기본값(src/dealbot/shops.py)을 key 단위로 덮어씁니다.
#   link_mode: api    = 자동 변환 (provider: coupang | linkprice)
#              manual = 내가 앱/사이트에서 만든 링크를 텔레그램으로 넘겨줘야 발행 (토스, 네이버)
#              raw    = 원본 링크 그대로 발행 (수익 없음, 정보 공유용)
#              skip   = 발행 안 함
#
# 기본 상태 (2026-09 결정: 수수료가 작거나 특가가 드문 몰은 조사에서 제외, 단 API 로 링크가 자동 발급되면 포함):
#   켜짐        coupang(API, 승인 전엔 반자동) · toss(반자동) · naver(반자동)
#   자동        11st, gmarket, auction, ssg, lotteon, aliexpress, ohouse, cjthemarket, hmall, lotteimall, gsshop, iherb,
#               nsmall, shinsegaelive, lfmall, hfashionmall, adidas
#               — 링크프라이스 API 로 자동 발급되므로 LINKPRICE_AFFILIATE_ID 가 있을 때만 자동으로 켜짐 (requires_provider).
#               링크프라이스에서 승인된 머천트의 링크만 실제로 변환됨
#   꺼짐(제외)  oliveyoung, kurly, musinsa (앱에서만 링크 생성 = API 없음, 의류·뷰티는 생필품 채널과 결이 다름) · temu, daiso (수익 없음)
#   미등록 몰   allow_raw_links: false 라 아예 건너뜀
# ----------------------------------------------------------------------------
shops:
  - { key: coupang, enabled: true }   # API 키 없으면(최종 승인 전) 파트너스 사이트에서 만든 링크를 요청(반자동), 키가 생기면 자동
  - { key: toss, enabled: true }
  - { key: naver, enabled: true }
  # 브라우저 자동화를 켰다면:  - { key: naver, link_mode: api, provider: naver_connect, manual_fallback: true }
  # 예) 올리브영을 다시 켜기(반자동):                  - { key: oliveyoung, enabled: true }
  # 예) 링크프라이스 없이도 SSG 를 원본 링크로 올리기:  - { key: ssg, enabled: true, link_mode: raw, requires_provider: false }

# ----------------------------------------------------------------------------
# 수집기(플러그인). type 은 내장 수집기 이름이거나 "패키지.모듈:클래스" 경로.
# 내장: coupang_goldbox | coupang_category_best | ppomppu | adpick_hotdeal
# ----------------------------------------------------------------------------
collectors:
  - name: goldbox
    label: 쿠팡 골드박스
    type: coupang_goldbox
    enabled: true
    interval_minutes: 120
    options:
      limit: 50
      image_size: "512x512"

  - name: category_best

    label: 쿠팡 카테고리 베스트
    type: coupang_category_best
    enabled: true
    interval_minutes: 240
    options:
      limit: 30
      # 1001 여성패션 1002 남성패션 1010 뷰티 1011 출산/유아동 1012 식품 1013 주방용품 1014 생활용품
      # 1015 홈인테리어 1016 가전디지털 1017 스포츠/레저 1018 자동차용품 1019 도서/음반 1020 완구/취미
      # 1021 문구/오피스 1024 헬스/건강식품 1029 반려동물용품 1030 유아동패션
      category_ids: [1016, 1012, 1014]   # 호출 예산(시간당 10회)을 생각해 3개만
      image_size: "512x512"
      delay_between_categories_seconds: 3

  # 뽐뿌 핫딜 게시판: 쿠팡/토스/네이버/11번가/G마켓/알리... 등록된 모든 쇼핑몰의 글을 수집
  - name: ppomppu
    label: 뽐뿌 핫딜
    type: ppomppu
    enabled: true
    interval_minutes: 5
    options:
      board_id: ppomppu          # 핫딜 게시판. 해외핫딜은 ppomppu4
      pages: 1
      shops: []                  # 비우면 등록된 모든 쇼핑몰. 예) ["coupang", "toss", "naver"]
      unknown_shop: skip         # 등록되지 않은 쇼핑몰 글: skip | raw(원본 링크로 발행)
      request_delay_seconds: 2
      max_detail_fetch_per_run: 15
      # 사이트 구조가 바뀌면 아래 셀렉터만 고치면 됩니다.
      list_row_selector: "tr.baseList"
      title_selector: "a.baseList-title"
      thumb_selector: "img"
      rec_selector: "td.baseList-rec"
      views_selector: "td.baseList-views"

  # 루리웹 업체 예판 핫딜 게시판(600004): 제휴 마케터들이 토스 딜을 올리는 곳. 카톡 핫딜방보다 하루쯤 빠름.
  # 추천/조회가 거의 없어 관심도 게이트는 always_pass_sources 로 통과시키고 시중가 대조로만 판정.
  - name: ruliweb_biz
    label: 루리웹 업체 핫딜
    type: ruliweb
    enabled: true
    interval_minutes: 5
    options:
      board_id: "600004"
      shops: ["toss"]            # 이 게시판에서는 토스 딜만
      request_delay_seconds: 2
      max_detail_fetch_per_run: 10

  # 루리웹 유저 핫딜 게시판(1020): 일반 회원이 공유하고 추천으로 검증되는 곳. 관심도 게이트 정상 적용.
  - name: ruliweb_user
    label: 루리웹 유저 핫딜
    type: ruliweb
    enabled: true
    interval_minutes: 5
    options:
      board_id: "1020"
      shops: []                  # 등록된 모든 쇼핑몰
      request_delay_seconds: 2
      max_detail_fetch_per_run: 10

  # 알구몬: 뽐뿌·루리웹·클리앙·퀘이사존 등 커뮤니티 핫딜 통합. 페이지 구조 확인 전이라 기본 꺼짐.
  # 켜서 돌린 뒤 /errors 에 "no rows matched ... DOM:" 이 뜨면 그 내용을 알려주세요 → options.selectors 를 맞춥니다.
  - name: algumon
    label: 알구몬
    type: algumon
    enabled: false
    interval_minutes: 15
    options:
      url: https://www.algumon.com/n/deal
      request_delay_seconds: 2
      max_detail_fetch_per_run: 10
      unknown_shop: skip
      # selectors:
      #   row: "li.post-li"
      #   title: "a.product-link"

  # 애드픽 쇼핑메이트 핫딜 API (ADPICK_AFFID 필요). 제휴 링크가 포함된 여러 쇼핑몰 핫딜 목록.
  - name: adpick
    label: 애드픽
    type: adpick_hotdeal
    enabled: false
    interval_minutes: 30
    options: {}

# ----------------------------------------------------------------------------
# 특가 판정: (a)(b)(c)(d) 중 하나만 만족하면 특가. 단 (d) 대조 결과 쿠팡보다 비싸면 탈락(veto).
# ----------------------------------------------------------------------------
deal:
  # 수집원별 기준 재정의 — 사이트마다 추천 수의 의미가 다릅니다.
  # 루리웹 핫딜 게시판은 추천이 후해서(하루 5~40) 기준을 높이고, 뽐뿌는 짜서 기본값을 씁니다.
  # /ppstats 로 분포를 본 뒤 조정하세요.
  per_source:
    ruliweb_user:
      interest_min_recommend: 3      # 루리웹은 추천이 후해서 관심도 기준만 살짝 올림
      coupon_min_recommend: 30       # 이벤트/공지 글은 추천 30 이상만 (라방 5원 같은 것)
    ruliweb_biz:
      community_min_recommend: 0     # 업체 게시판은 추천이 안 붙음 → 시중가 대조로만 판정
      coupon_min_recommend: 0
  # 품절/종료된 딜 정리
  #  - 게시판을 다시 읽을 때 제목에 품절·종료·마감·매진 표시가 붙은 글 → 기다리는 글에서 내리고, 보냈던 링크 요청 메시지를
  #    "품절되어 취소했습니다" 로 고치고, 올린 지 mark_published_hours 안의 채널 글에는 맨 위에 "⛔ 품절" 표시
  #  - 상품 페이지를 읽을 수 있는 몰(enrich.shops: 토스·네이버 등)은 링크 요청 전·발행 전에 재고를 확인하고,
  #    링크를 기다리는 동안 recheck_awaiting_minutes 마다 다시 확인
  sold_out:
    enabled: true
    check_page_before_link_request: true
    check_page_before_publish: true
    recheck_awaiting_minutes: 5
    mark_published_hours: 24
  # 상품 페이지(OG/JSON-LD)에서 이미지·가격·별점·리뷰 수를 읽어 빈 칸 채우기 (토스 쉐어링크 페이지 등)
  enrich:
    enabled: true
    shops: [toss, naver, oliveyoung, kurly, musinsa]
    max_per_run: 10
  # 정품·공식 판매처 확인 (필수 기준). 병행수입·구매대행·리퍼 같은 표시가 제목·게시글·상품 페이지 어디에든 있으면 올리지 않음.
  # 오픈마켓(open_markets) 딜은 제목·게시글·판매자명에 공식 표시(official_markers)가 있어야 자동으로 올리고,
  # 없으면 unverified_action 대로: review = 관리자 챗에 "🔎 정품 확인 필요" 를 보내 /ok 후 올림 / skip = 안 올림 / allow = 그냥 올림.
  # 공식 몰(올리브영·컬리·LF몰 등)과 쿠팡은 병행수입 표시만 없으면 통과. 링크를 직접 만드는 몰(토스·네이버)은 링크 요청 메시지에 확인 문구가 붙음.
  authenticity:
    enabled: true
    unverified_action: review
    trusted_reviews: 100         # 후기가 이만큼 쌓인 상품은 공식 표시가 없어도 통과 (0 = 안 씀)
    coupang_min_reviews: 30      # 쿠팡은 판매자를 못 가리므로 후기 양으로: 후기 수를 알았는데 이보다 적으면 안 올림 (모르면 통과, 0 = 안 씀)
    open_markets: [gmarket, auction, 11st, lotteon, ssg, aliexpress, temu, ohouse, naver, toss]
    official_markers: [공식, 브랜드관, 브랜드 스토어, 브랜드스토어, 본사, 직영, official store, official]
    reject_keywords: [병행수입, 병행 수입, 병행, 구매대행, 해외구매대행, 리퍼, 리퍼비시, 리퍼상품, 리퍼제품, 리퍼폰, 중고, 중고품, 중고상품, 벌크, 벌크포장, 전시상품, 전시품, 반품상품, 박스훼손, 짝퉁, 이미테이션, 레플리카, 스크래치]
  # 후기 수 기준: 상품 페이지에서 후기 수를 읽었는데 이보다 적으면 제외 (후기 수를 못 읽은 상품은 통과)
  quality:
    enabled: true
    min_review_count: 10
    shops: []                  # 비우면 전체 쇼핑몰
  require_shop_url: true       # 원본 주소가 쇼핑몰이 아니라 게시판 글이면(링크 못 찾은 이벤트 글 등) 링크 요청 없이 건너뜀
  # 0) 관심도 게이트: 전 상품을 대조할 수 없으니, 사람들이 관심 있어 보이는 딜만 판정 대상으로.
  #    아래 중 하나라도 넘으면 통과 (값이 없는 신호는 무시). manual/adpick 소스는 항상 통과.
  interest:
    enabled: true
    min_recommend: 1           # 커뮤니티 추천
    min_comments: 3            # 커뮤니티 댓글
    min_views: 500             # 커뮤니티 조회수
    max_rank: 30               # 골드박스/카테고리 베스트 순위
    always_pass_sources: [manual, adpick, ruliweb_biz]   # 게이트 없이 통과시킬 수집기 이름
  # (d) 시중가 대조 = 기본 규칙: 다른 몰의 딜을 쿠팡 검색으로 찾은 같은 상품 가격과 비교 (쿠팡 API 키 필요)
  market:
    enabled: true
    min_below_market_pct: 20     # 쿠팡 검색 최저가보다 최소 20% 이상 싸야 특가
    strict: true                 # 대조 결과가 있으면 20% 미만은 무조건 탈락 (보조 규칙으로 안 넘어감)
    veto_if_not_cheaper: true    # (strict 가 아닐 때) 쿠팡가보다 싸지 않으면 (a)/(c) 로 잡혀도 탈락
    require_for_discount_rule: true  # 대조가 가능한 환경이면 (a) 표시 할인율만으로는 통과 못 함
    max_checks_per_hour: 3       # 쿠팡 검색 API 호출 (전체 예산 10회 안에서)
    cache_hours: 24
    min_token_match: 0.6         # 상품명 토큰 일치 비율 (수량 토큰은 반드시 일치)
  min_discount_rate: 50          # (a) 표시 할인율 N% 이상 — 서브 신호. 쿠팡 표시 할인율은 부풀려진 경우가 많아 50 으로
  history_days: 30               # (b) 최근 N일 평균가 기준
  min_below_average_pct: 15      # (b) 평균가 대비 N% 이상 저렴
  min_history_samples: 3         # (b) 평균가 계산에 필요한 최소 관측 횟수
  observation_min_gap_hours: 6   # 같은 상품 가격은 6시간에 1번만 기록 (재판정 때 같은 값이 쌓이는 것 방지)
  community_min_recommend: 5     # (c) 가격이 적힌 딜: 커뮤니티 추천 N 이상
  coupon_min_recommend: 20       # 가격 없는 쿠폰/이벤트/공지: 노이즈가 많아 기준을 높게
  accept_coupons_and_events: false # 가격 없는 쿠폰/이벤트/공지 글은 올리지 않음 (true 로 바꾸면 추천 수(coupon_min_recommend)로 판정해 발행)
                                   # 가격이 적힌 딜은 제목에 '이벤트/증정' 이 있어도 가격 기준으로 그대로 판정
  min_price: 1000
  exclude_keywords: []           # 예: ["리퍼", "중고", "품절"]

# ----------------------------------------------------------------------------
# 발행 (텔레그램 채널)
# ----------------------------------------------------------------------------
publish:
  enabled: true
  dry_run: false
  max_per_hour: 12               # 시간당 최대 발행 (딜이 몰리는 시간대 병목 방지)
  max_per_day: 80
  min_interval_seconds: 60       # 발행 간 최소 간격
  dedup_days: 7
  # 이름이 거의 같은 상품(다른 게시판·주소 변형)은 같은 딜로 보고 안 올림 (0~1, 0 이면 끔). 숫자(모델·용량·수량)가 다르면 다른 상품.
  # 전에 올린 것보다 dedupe_cheaper_pct% 이상 싸졌으면 새 딜로 인정
  dedupe_similarity: 0.8
  dedupe_cheaper_pct: 10
  queue_ttl_hours: 6             # 자동 발행 대기 항목 유효 시간
  manual_link_ttl_hours: 12      # 내 링크 입력을 기다리는 항목 유효 시간
  max_publish_attempts: 3
  publisher_tick_seconds: 20
  send_photo: true
  quiet_hours: "00:00-07:00"     # 이 시간대(한국시간)에는 채널 글을 무음으로 올림 (구독자 알림 없음). 비우면 항상 알림
  max_awaiting_links: 6          # 내 링크 요청이 이 개수 이상 쌓이면 새 요청은 건너뜀 (관리자 챗 폭주 방지). 0 = 제한 없음
  allow_raw_links: false         # 제휴 링크를 못 만드는 쇼핑몰(미등록 몰 포함)은 건너뜀. true 면 수익 없는 원본 링크로라도 발행
  templates_dir: templates
  template: deal_post.j2

# 스레드 자동 발행 (THREADS_APP_ID/SECRET 필요, /threadsauth 로 최초 1회 연결)
threads:
  enabled: true
  template: deal_threads.j2               # 첫 글(훅): 짧게, 링크 없이 — 잘 되는 핫딜 계정 형식
  reply_template: deal_threads_reply.j2   # 답글: 링크 + 수수료 고지 (비우면 한 글로 올림)
  send_photo: true
  refresh_before_days: 7

# API 가 없어 복붙해야 하는 곳: 발행 성공 시 관리자 챗으로 완성된 문구를 보냄
copy:
  enabled: true
  targets:
    - { key: kakao, name: 카카오 오픈채팅, template: deal_kakao.j2, enabled: true }
    - { key: blog, name: 네이버 블로그, template: deal_blog.j2, enabled: true }

links:
  always_deeplink: false
  resolve_short_links: true
  provider_error_cooldown_hours: 12  # 링크프라이스 링크 생성 실패한 몰(승인 전 머천트 등)은 이 시간 동안 건너뜀 (알림도 그때 1번). 0 = 매번 시도

# 정보 글: 상품 링크가 없는 게시판 글(이벤트·결제 할인 공지 등)을 본문·사진만 정리해 올림. 수익 링크는 없음
info_posts:
  enabled: true
  min_recommend: 5             # 커뮤니티 추천 수가 이 값 이상인 글만
  max_per_day: 10
  max_chars: 500               # 본문 정리 길이
  send_photo: true             # 원문에 사진이 있으면 봇이 받아서 같이 올림
  template: info_post.j2       # 텔레그램 양식
  kakao_template: info_kakao.j2
  threads_template: info_threads.j2
  # 올리기 전 확인: auto = 요약이 만들어지면 바로 올리고, 못 만들거나 본문 위치가 불확실하면 관리자 챗에 "정보 글 확인 #번호" 를 보내 /ok 를 기다림
  #                always = 정보 글은 항상 확인 후 올림 / never = 확인 없이 정리한 원문을 그대로 올림 (비추천)
  review: auto
  # 이벤트성 글은 혜택이 이만큼은 돼야 올림: 할인율 40% 이상 또는 할인·적립 금액 5,000원 이상 (둘 중 하나. 0 이면 그 기준은 안 봄)
  min_discount_rate: 40
  min_discount_amount: 5000
  summarizer:                  # 게시판 글을 채널 양식(한 줄 요약 + '·' 항목)으로 다시 쓰기. Railway Variables 에 ANTHROPIC_API_KEY 가 있어야 돈다
    enabled: true
    model: claude-opus-5
    raw_chars: 4000            # 요약기에 넘기는 원문 최대 길이
    timeout_seconds: 60

# 하루치 발행 딜을 모아 밤에 블로그 글 한 편(복붙용)으로 관리자 챗에 보냄. /blog 로 지금까지 모인 것을 미리 만들어 볼 수 있음
blog_digest:
  enabled: true
  time: "21:30"
  template: blog_daily.j2
  max_items: 10                # 글 하나에 넣는 최대 딜 수 (점수 높은 순)
  min_items: 1                 # 이보다 적으면 안 보냄
  include_info: true           # 정보 글(이벤트)도 넣음 (정리된 본문이 있는 것만)
  max_info_items: 3
  blog_name: "Deren의 아카이브" # 도입부 "OO를 운영하고 있는 OO입니다"
  author: "Deren"
  always_disclosures:          # 글마다 반드시 넣는 고지 문구 (쿠팡 딜이 없는 날도)
    - "이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다."

# 내 채널 주소. 글 하단에 서로 연결하는 줄을 넣는다 (비우면 그 줄은 빠짐)
channels:
  telegram_url: "https://t.me/hot_deal_and_info"
  kakao_openchat_url: "https://open.kakao.com/o/pHi1MkMi"
  threads_url: "https://www.threads.net/@oneul_hot_deal"
  telegram_name: "오늘의 핫딜"          # 블로그 글의 채널 안내에 쓰는 이름 ("텔레그램 · 오늘의 핫딜")
  kakao_openchat_name: "오늘의 핫딜 오픈채팅"

# ----------------------------------------------------------------------------
# 모니터링 (관리자 개인 챗)
# ----------------------------------------------------------------------------
monitoring:
  # 휴대폰 푸시 (NTFY_TOPIC 또는 PUSHOVER_* 가 .env 에 있으면 자동 사용)
  push:
    provider: auto             # auto | ntfy | pushover | none
    events: [manual_link, info_review]  # manual_link | info_review | publish_failed | error | daily_summary | startup
    ntfy_url: https://ntfy.sh
  notify_on_publish: false           # 채널에 올릴 때마다 오던 '✅ 채널에 올렸습니다' 알림 끔 (카톡 복붙 문구는 그대로 옴)
  notify_on_failure: true
  notify_failure_attempts: false  # 재시도 중 실패(⚠️)는 조용히, 최종 포기(❌)만 알림
  notify_on_error: true
  notify_on_manual_link: true    # 토스/네이버 등 수동 링크가 필요할 때 알림
  error_alert_cooldown_minutes: 30
  daily_summary_time: "21:00"
  quiet_notices: false           # false: 시작/미리보기/발행 알림도 소리·진동과 함께 (true 면 무음)
  heartbeat_minutes: 0             # 0 = '정상 가동 중' 생존 보고 끔 (에러·요청만 받음). N 이면 관리자 챗이 N분 조용할 때 보고

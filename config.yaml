# ============================================================================
# coupang-deal-bot 설정 파일
# 비밀값(API 키, 토큰)은 여기에 쓰지 말고 .env / 환경변수로 관리합니다.
# 값을 바꾼 뒤에는 봇을 재시작하세요.
# ============================================================================

app:
  timezone: Asia/Seoul
  log_level: INFO
  scheduler_tick_seconds: 30
  prune_price_history_days: 180
  prune_events_days: 30

http:
  timeout_seconds: 20
  max_retries: 3
  retry_backoff_seconds: 2
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

# ----------------------------------------------------------------------------
# 쇼핑몰별 링크 처리. 기본값(src/dealbot/shops.py)을 key 단위로 덮어씁니다.
#   link_mode: api    = 자동 변환 (provider: coupang | linkprice)
#              manual = 내가 앱/사이트에서 만든 링크를 텔레그램으로 넘겨줘야 발행 (토스, 네이버, 올리브영, 컬리, 무신사)
#              raw    = 원본 링크 그대로 발행 (수익 없음, 정보 공유용)
#              skip   = 발행 안 함
# 기본 등록: coupang, toss, naver, oliveyoung, kurly, musinsa, 11st, gmarket, auction, ssg, lotteon,
#            aliexpress, temu, daiso, ohouse
# ----------------------------------------------------------------------------
shops:
  - { key: coupang, enabled: true }
  - { key: toss, enabled: true }
  - { key: naver, enabled: true }
  # 예) 네이버는 링크 만들기 귀찮으니 원본 링크로만: - { key: naver, link_mode: raw }
  # 예) 테무는 아예 제외:                            - { key: temu, enabled: false }

# ----------------------------------------------------------------------------
# 수집기(플러그인). type 은 내장 수집기 이름이거나 "패키지.모듈:클래스" 경로.
# 내장: coupang_goldbox | coupang_category_best | ppomppu | adpick_hotdeal
# ----------------------------------------------------------------------------
collectors:
  - name: goldbox
    type: coupang_goldbox
    enabled: true
    interval_minutes: 60
    options:
      limit: 50
      image_size: "512x512"

  - name: category_best
    type: coupang_category_best
    enabled: true
    interval_minutes: 180
    options:
      limit: 30
      # 1001 여성패션 1002 남성패션 1010 뷰티 1011 출산/유아동 1012 식품 1013 주방용품 1014 생활용품
      # 1015 홈인테리어 1016 가전디지털 1017 스포츠/레저 1018 자동차용품 1019 도서/음반 1020 완구/취미
      # 1021 문구/오피스 1024 헬스/건강식품 1029 반려동물용품 1030 유아동패션
      category_ids: [1016, 1012, 1014, 1010]
      image_size: "512x512"
      delay_between_categories_seconds: 3

  # 뽐뿌 핫딜 게시판: 쿠팡/토스/네이버/11번가/G마켓/알리... 등록된 모든 쇼핑몰의 글을 수집
  - name: ppomppu
    type: ppomppu
    enabled: true
    interval_minutes: 20
    options:
      board_id: ppomppu          # 핫딜 게시판. 해외핫딜은 ppomppu4
      pages: 1
      shops: []                  # 비우면 등록된 모든 쇼핑몰. 예) ["coupang", "toss", "naver"]
      unknown_shop: skip         # 등록되지 않은 쇼핑몰 글: skip | raw(원본 링크로 발행)
      request_delay_seconds: 2
      max_detail_fetch_per_run: 15
      # 사이트 구조가 바뀌면 아래 셀렉터만 고치면 됩니다.
      list_row_selector: "tr.baseList"
      title_selector: "a.baseList-title"
      thumb_selector: "img"
      rec_selector: "td.baseList-rec"
      views_selector: "td.baseList-views"

  # 애드픽 쇼핑메이트 핫딜 API (ADPICK_AFFID 필요). 제휴 링크가 포함된 여러 쇼핑몰 핫딜 목록.
  - name: adpick
    type: adpick_hotdeal
    enabled: false
    interval_minutes: 30
    options: {}

# ----------------------------------------------------------------------------
# 특가 판정: (a) 또는 (b) 또는 (c) 중 하나만 만족하면 특가
# ----------------------------------------------------------------------------
deal:
  min_discount_rate: 30          # (a) 표시 할인율 N% 이상
  history_days: 30               # (b) 최근 N일 평균가 기준
  min_below_average_pct: 15      # (b) 평균가 대비 N% 이상 저렴
  min_history_samples: 3         # (b) 평균가 계산에 필요한 최소 관측 횟수
  community_min_recommend: 5     # (c) 커뮤니티 추천 수 N 이상 (0 이면 비활성)
  accept_coupons_and_events: true  # 가격 없는 쿠폰/이벤트 글도 (c) 로 판정해 발행
  min_price: 1000
  exclude_keywords: []           # 예: ["리퍼", "중고", "품절"]

# ----------------------------------------------------------------------------
# 발행 (텔레그램 채널)
# ----------------------------------------------------------------------------
publish:
  enabled: true
  dry_run: false
  max_per_hour: 6
  max_per_day: 40
  min_interval_seconds: 180
  dedup_days: 7
  queue_ttl_hours: 6             # 자동 발행 대기 항목 유효 시간
  manual_link_ttl_hours: 12      # 내 링크 입력을 기다리는 항목 유효 시간
  max_publish_attempts: 3
  publisher_tick_seconds: 20
  send_photo: true
  allow_raw_links: true          # 제휴 변환 수단이 없는 쇼핑몰은 원본 링크로 발행 (false 면 건너뜀)
  templates_dir: templates
  template: deal_post.j2

links:
  always_deeplink: false
  resolve_short_links: true

# ----------------------------------------------------------------------------
# 모니터링 (관리자 개인 챗)
# ----------------------------------------------------------------------------
monitoring:
  # 휴대폰 푸시 (NTFY_TOPIC 또는 PUSHOVER_* 가 .env 에 있으면 자동 사용)
  push:
    provider: auto             # auto | ntfy | pushover | none
    events: [manual_link]      # manual_link | publish_failed | error | daily_summary | startup
    ntfy_url: https://ntfy.sh
  notify_on_publish: true
  notify_on_failure: true
  notify_on_error: true
  notify_on_manual_link: true    # 토스/네이버 등 수동 링크가 필요할 때 알림
  error_alert_cooldown_minutes: 30
  daily_summary_time: "21:00"

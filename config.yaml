# ============================================================================
# coupang-deal-bot 설정 파일
# 비밀값(API 키, 토큰)은 여기에 쓰지 말고 .env / 환경변수로 관리합니다.
# 값을 바꾼 뒤에는 봇을 재시작하세요.
# ============================================================================

app:
  timezone: Asia/Seoul
  log_level: INFO
  scheduler_tick_seconds: 30
  prune_price_history_days: 180
  prune_events_days: 30

# 쿠팡파트너스 API 호출 예산 (시간당). 검색 API 기준 시간당 10회 제한이 알려져 있어 보수적으로 잡음.
# 문서에서 더 높은 한도를 확인하면 올리세요. 0 = 무제한.
coupang:
  max_calls_per_hour: 10
  deeplink_reserve: 3          # 발행용 딥링크 호출을 위해 항상 남겨 둘 몫
  deeplink_max_per_hour: 7     # 딥링크는 시간당 이만큼까지만 (골드박스·시중가 조회 몫을 남김). 넘치는 쿠팡 딜은 다음 시간에 올라감

# ⚠️ 네이버는 2026-07-09부터 매크로·봇·스크립트로 쇼핑 커넥트 링크를 반복 발급하는 것을 감지해 제재함
#    (경고 → 7일 발급 제한 → 추가 제재). 그래서 꺼 둠 — 링크는 관리자가 직접 만들어 답장, 봇은 상품별로 기억해 재사용.
# 네이버 쇼핑커넥트 브라우저 자동화 (선택). 켜면 /naverlogin 으로 QR 로그인 후 네이버 딜 링크를 자동 생성 시도,
# 실패하면 수동(관리자 링크) 으로 넘어감. 아래 shops 에서 naver 를 link_mode: api 로 바꿔야 동작.
browser:
  enabled: false
  headless: true
  profile_dir: browser-profile
  naver_connect:
    login_url: https://nid.naver.com/nidlogin.login
    create_url: https://connect.naver.com/     # 실제 링크 생성 페이지 주소로 수정 필요 (/shot 으로 확인)
    selectors:
      qr_tab: "text=QR코드"
      url_input: "input[type='url'], input[placeholder*='URL'], input[placeholder*='주소'], input[type='text']"
      create_button: "text=링크 발급"
      result: "input[readonly], textarea[readonly], a[href*='naver.me'], a[href*='connect']"

# 네이버 쇼핑커넥트 링크 자동 만들기 (주인 결정 10/11: 제재 위험을 알고도 자동화 — 위 browser 와는 다른 새 방식).
# 브라우저 일은 Blog-Auto 가 아카이브 계정(finance 프로필)으로 한다 → Blog-Auto config/hotdeal.yaml 의 shopping_connect 도 켜야 동작.
# 쇼핑커넥트에 있으면 그 링크(이미 있으면 재사용), 없는 상품은 내 링크 없이 원본 주소로(제휴 고지 없음, 주인에게 안 물음),
# 오류·시간 초과·로그인·한도면 예전처럼 주인에게 링크 요청. 로그인·제한 안내로 멈추면 카톡으로 한 번 알림.
autolink:
  naver:
    enabled: false        # 켜기 전에 서버에서 읽기 전용 확인(probes/sc_lookup.py)부터
    wait_minutes: 30      # Blog-Auto 답을 기다리는 시간. 넘으면 링크 요청
    not_found_days: 7     # 쇼핑커넥트에 없던 상품번호는 이 기간 다시 찾지 않고 원본 주소로
    unverified: manual    # 판매처 확인이 안 된 딜: manual = 예전처럼 링크 요청 / auto = 그래도 자동

http:
  timeout_seconds: 20
  max_retries: 3
  retry_backoff_seconds: 2
  # user_agent: 비우면 "dealbot/버전" — 봇이라고 밝힌다 (브라우저 UA 로 꾸미지 않음)

# ----------------------------------------------------------------------------
# 쇼핑몰별 링크 처리. 기본값(src/dealbot/shops.py)을 key 단위로 덮어씁니다.
#   link_mode: api    = 자동 변환 (provider: coupang | linkprice)
#              manual = 내가 앱/사이트에서 만든 링크를 텔레그램으로 넘겨줘야 발행 (토스, 네이버)
#              raw    = 원본 링크 그대로 발행 (수익 없음, 정보 공유용)
#              skip   = 발행 안 함
#
# 기본 상태 (2026-09 결정: 수수료가 작거나 특가가 드문 몰은 조사에서 제외, 단 API 로 링크가 자동 발급되면 포함):
#   켜짐        coupang(API, 승인 전엔 반자동) · toss(반자동) · naver(반자동)
#   자동        11st, gmarket, auction, ssg, lotteon, aliexpress, ohouse, cjthemarket, hmall, lotteimall, gsshop, iherb,
#               nsmall, shinsegaelive, lfmall, hfashionmall, adidas
#               — 링크프라이스 API 로 자동 발급되므로 LINKPRICE_AFFILIATE_ID 가 있을 때만 자동으로 켜짐 (requires_provider).
#               링크프라이스에서 승인된 머천트의 링크만 실제로 변환됨
#   꺼짐(제외)  oliveyoung, kurly, musinsa (앱에서만 링크 생성 = API 없음, 의류·뷰티는 생필품 채널과 결이 다름) · temu, daiso (수익 없음)
#   미등록 몰   allow_raw_links: false 라 아예 건너뜀
# ----------------------------------------------------------------------------
shops:
  - { key: coupang, enabled: true }   # API 키 없으면(최종 승인 전) 파트너스 사이트에서 만든 링크를 요청(반자동), 키가 생기면 자동
  - { key: toss, enabled: true }
  - { key: naver, enabled: true }
  # 브라우저 자동화를 켰다면:  - { key: naver, link_mode: api, provider: naver_connect, manual_fallback: true }
  # 예) 올리브영을 다시 켜기(반자동):                  - { key: oliveyoung, enabled: true }
  # 예) 링크프라이스 없이도 SSG 를 원본 링크로 올리기:  - { key: ssg, enabled: true, link_mode: raw, requires_provider: false }

# ----------------------------------------------------------------------------
# 수집기(플러그인). type 은 내장 수집기 이름이거나 "패키지.모듈:클래스" 경로.
# 내장: coupang_goldbox | coupang_category_best | ppomppu | adpick_hotdeal
# ----------------------------------------------------------------------------
collectors:
  - name: goldbox
    label: 쿠팡 골드박스
    type: coupang_goldbox
    enabled: true
    interval_minutes: 120
    options:
      limit: 50
      image_size: "1000x1000"   # 사진은 짧은 변 600px 이상만 올림 (512 는 블로그·텔레그램에서 작고 흐림)

  - name: category_best

    label: 쿠팡 카테고리 베스트
    type: coupang_category_best
    enabled: true
    interval_minutes: 180          # 3시간마다 3개씩 → 쿠팡 API 시간당 평균 1회 (예전 4시간마다 3개 = 0.75회)
    options:
      limit: 30
      # 1001 여성패션 1002 남성패션 1010 뷰티 1011 출산/유아동 1012 식품 1013 주방용품 1014 생활용품
      # 1015 홈인테리어 1016 가전디지털 1017 스포츠/레저 1018 자동차용품 1019 도서/음반 1020 완구/취미
      # 1021 문구/오피스 1024 헬스/건강식품 1029 반려동물용품 1030 유아동패션
      # 생필품 채널에 맞는 9개를 돌아가며 (주인 결정 10/13: 3개만 보던 것을 넓힘). 의류·도서·완구는 뺌
      category_ids: [1016, 1012, 1014, 1013, 1010, 1024, 1029, 1011, 1015]
      categories_per_run: 3          # 한 판에 3개씩 (9개를 9시간에 한 바퀴). 어디까지 봤는지는 DB 에 남아 재시작해도 이어서
      # 쿠팡 API 공용 몫(시간당 10회 - 딥링크 예약 3회 = 7회)이 이만큼 이하로 남으면 멈추고 다음 판에:
      # 골드박스(2시간에 1회)·시중가 조회(시간당 3회)·딥링크 몫을 남김. 최악의 한 시간도 골드박스 1 + 카테고리 3 + 검색 3 = 7 ≤ 공용 몫
      keep_free_calls: 1
      image_size: "1000x1000"
      delay_between_categories_seconds: 3

  # 뽐뿌 핫딜 게시판: 쿠팡/토스/네이버/11번가/G마켓/알리... 등록된 모든 쇼핑몰의 글을 수집
  - name: ppomppu
    label: 뽐뿌 핫딜
    type: ppomppu
    enabled: true
    interval_minutes: 5
    options:
      board_id: ppomppu          # 핫딜 게시판. 해외핫딜은 ppomppu4
      pages: 1
      shops: []                  # 비우면 등록된 모든 쇼핑몰. 예) ["coupang", "toss", "naver"]
      unknown_shop: skip         # 등록되지 않은 쇼핑몰 글: skip | raw(원본 링크로 발행)
      request_delay_seconds: 2
      max_detail_fetch_per_run: 15
      # 사이트 구조가 바뀌면 아래 셀렉터만 고치면 됩니다.
      list_row_selector: "tr.baseList"
      title_selector: "a.baseList-title"
      thumb_selector: "img"
      rec_selector: "td.baseList-rec"
      views_selector: "td.baseList-views"

  # 루리웹 업체 예판 핫딜 게시판(600004): 제휴 마케터들이 토스 딜을 올리는 곳. 카톡 핫딜방보다 하루쯤 빠름.
  # 추천/조회가 거의 없어 관심도 게이트는 always_pass_sources 로 통과시키고 시중가 대조로만 판정.
  - name: ruliweb_biz
    label: 루리웹 업체 핫딜
    type: ruliweb
    enabled: false        # AWS(Lightsail) 서버 IP 는 루리웹이 접속을 막음 (2026-10 확인)
    interval_minutes: 5
    options:
      board_id: "600004"
      shops: ["toss"]            # 이 게시판에서는 토스 딜만
      request_delay_seconds: 2
      max_detail_fetch_per_run: 10

  # 루리웹 유저 핫딜 게시판(1020): 일반 회원이 공유하고 추천으로 검증되는 곳. 관심도 게이트 정상 적용.
  - name: ruliweb_user
    label: 루리웹 유저 핫딜
    type: ruliweb
    enabled: false        # AWS(Lightsail) 서버 IP 는 루리웹이 접속을 막음 (2026-10 확인)
    interval_minutes: 5
    options:
      board_id: "1020"
      shops: []                  # 등록된 모든 쇼핑몰
      request_delay_seconds: 2
      max_detail_fetch_per_run: 10

  # 알구몬: 뽐뿌·루리웹·클리앙·퀘이사존 등 커뮤니티 핫딜 통합. 페이지 구조 확인 전이라 기본 꺼짐.
  # 켜서 돌린 뒤 /errors 에 "no rows matched ... DOM:" 이 뜨면 그 내용을 알려주세요 → options.selectors 를 맞춥니다.
  - name: algumon
    label: 알구몬
    type: algumon
    enabled: false
    interval_minutes: 15
    options:
      url: https://www.algumon.com/n/deal
      request_delay_seconds: 2
      max_detail_fetch_per_run: 10
      unknown_shop: skip
      # selectors:
      #   row: "li.post-li"
      #   title: "a.product-link"

  # 애드픽 쇼핑메이트 핫딜 API (ADPICK_AFFID 필요). 제휴 링크가 포함된 여러 쇼핑몰 핫딜 목록.
  - name: adpick
    label: 애드픽
    type: adpick_hotdeal
    enabled: false
    interval_minutes: 30
    options: {}

# ----------------------------------------------------------------------------
# 특가 판정: (a)(b)(c)(d)(e) 중 하나만 만족하면 특가. 단 (d)·(e) 대조 결과 비교한 곳(쿠팡·네이버)보다 비싸면 탈락(veto).
# ----------------------------------------------------------------------------
deal:
  # 수집원별 기준 재정의 — 사이트마다 추천 수의 의미가 다릅니다.
  # 루리웹 핫딜 게시판은 추천이 후해서(하루 5~40) 기준을 높이고, 뽐뿌는 짜서 기본값을 씁니다.
  # /ppstats 로 분포를 본 뒤 조정하세요.
  per_source:
    # 쿠팡 골드박스: 응답에 정가·할인율 칸이 없어(10/14 서버 확인) 표시 할인율 규칙으로는 통과할 수 없었다 →
    # 아래 naver_reference(네이버 최저가보다 N%↓)와 가격 이력((b)·(b'))으로 판정. 할인율 칸이 생기면 50%↑ 단독 통과도 그대로
    # (그래도 네이버 최저가보다 비싸면 탈락)
    goldbox:
      discount_alone: true
      min_discount_rate: 50
    category_best:                   # 카테고리 베스트는 '많이 팔리는 상품'일 뿐 → 가격 근거(네이버 최저가·이력) 있을 때만
      discount_alone: false
    ruliweb_user:
      interest_min_recommend: 3      # 루리웹은 추천이 후해서 관심도 기준만 살짝 올림
      coupon_min_recommend: 30       # 이벤트/공지 글은 추천 30 이상만 (라방 5원 같은 것)
    ruliweb_biz:
      community_min_recommend: 0     # 업체 게시판은 추천이 안 붙음 → 시중가 대조로만 판정
      coupon_min_recommend: 0
  # 품절/종료된 딜 정리
  #  - 게시판을 다시 읽을 때 제목에 품절·종료·마감·매진 표시가 붙은 글 → 기다리는 글에서 내리고, 보냈던 링크 요청 메시지를
  #    "품절되어 취소했습니다" 로 고치고, 올린 지 mark_published_hours 안의 채널 글에는 맨 위에 "⛔ 품절" 표시
  #  - 상품 페이지를 읽을 수 있는 몰(enrich.shops: 토스·네이버 등)은 링크 요청 전·발행 전에 재고를 확인하고,
  #    링크를 기다리는 동안 recheck_awaiting_minutes 마다 다시 확인
  sold_out:
    enabled: true
    check_page_before_link_request: true
    check_page_before_publish: true
    recheck_awaiting_minutes: 5
    mark_published_hours: 24
  # 상품 페이지 가격 대조 (주인 결정 10/12, 큐 #22: 제목 '24개 6,410원' 이 실제로는 12개 옵션 값이었음)
  #  - 수집 때 읽는 상품 페이지의 가격·옵션을 제목 가격과 비교. ±tolerance_pct 안이면 진행(시중가 대조도 페이지 가격으로),
  #    다른 옵션에 맞으면 옵션 이름을 남김. 그 옵션 수량이 제목과 다르거나 맞는 값이 없으면 보류 — 링크 요청·발행 없이
  #    관리자 챗에 "⏸ #번호 보류: …" 한 줄 (조용히). 페이지를 못 읽었거나 가격이 없으면 지금처럼 진행
  #  - 토스 웹 상품 페이지는 가격을 보여 주지 않아(앱에서만) 토스는 지금은 늘 '확인 못 함'. 네이버는 스토어 페이지를 읽었을 때만
  #  - 네이버 스토어는 일반 요청이 거의 늘 429 (10/12: 17시 이후 네이버 딜 207번 모두 '확인 못 함'). 그래서 일반 요청이 막히면
  #    사진용 크롬(enrich.store_browser, 위장 없는 빈 창)으로 한 번 읽어 대조 (browser). 수집이 오래 멈추지 않게 한 판에
  #    browser_per_run 번·한 시간에 browser_per_hour 번까지, 한 번에 browser_timeout_seconds 초까지. 못 읽은 딜은 지금처럼 올라가고 다음 판에 다시 봄
  #  - 크롬도 막히면(429·403·캡차·빈 페이지) 30분 크롬을 쉼 (또 막히면 60분, 사진용 크롬도 같이. 로그는 쉬기 시작할 때 한 번)
  #  - 읽은 페이지 가격·옵션은 상품마다 cache_minutes 동안 기억 (5분마다 다시 안 읽음). '확인 못 함' 로그는 상품마다 하루 한 번
  page_check:
    enabled: true
    tolerance_pct: 10
    discount_tolerance_pct: 25     # 제목에 카드·쿠폰·적립·멤버십 말이 있으면 글 가격이 페이지보다 25%까지 싸도 맞은 것으로 (페이지에 안 보이는 할인)
    shops: [toss, naver]
    # 일반 요청이 막힌 네이버 상품 페이지를 크롬으로 읽을지 (false = 예전처럼 '확인 못 함' → 그대로 게시).
    # 10/13 꺼 둠: 서버 IP 가 스토어 쪽에서 강하게 막혀(429·로그인 화면) 가격은 한 번도 못 읽었고, 크롬은 발행 직전 사진(인스타 필수)에 아껴 쓴다
    browser: false
    browser_per_run: 1             # 수집 한 판에 크롬으로 읽는 페이지 수 (크롬이 바쁘거나 열기 간격 안이면 기다리지 않고 다음 판에)
    browser_per_hour: 12           # 한 시간에 (모든 수집기 합)
    browser_timeout_seconds: 40    # 한 번 읽기(크롬 띄우기~닫기) 시간 제한 — 넘으면 끊고 닫음
    browser_cooldown_minutes: 30   # 크롬도 막히면 쉬는 시간 (30~60분 권장). 크롬으로 못 읽은 상품(시간 초과·로그인 등 다른 페이지로 넘어감)은
                                   # 그 상품만 이만큼 뒤에 다시, 또 못 읽으면 두 배씩 (최대 6시간). 막힌 상품은 처음부터 두 배 (다른 상품 먼저)
    browser_cooldown_max_minutes: 60
    cache_minutes: 120             # 읽은 페이지 가격·옵션을 상품마다 2시간 기억 (그동안 일반 요청·크롬 다시 안 함, 0 = 안 씀)
    unverified_log_hours: 24       # '확인 못 함' 로그는 상품마다 하루 한 번 (이유와 함께)
  # 상품 페이지(OG/JSON-LD)에서 이미지·가격·별점·리뷰 수를 읽어 빈 칸 채우기 (토스 쉐어링크 페이지 등)
  enrich:
    enabled: true
    shops: ["*"]               # 모든 몰의 상품 페이지에서 대표 사진·후기 수를 읽음 (게시판 썸네일 대신)
    exclude_shops: [coupang]   # 쿠팡은 페이지를 못 읽음 → 파트너스 API 사진 사용
    max_per_run: 10
    # 네이버 스마트스토어·브랜드스토어는 몰아서 읽으면 429: 요청 사이 간격, 429·5xx 는 Retry-After(없으면 2→4초 백오프+지터)로 몇 번만 다시.
    # 그래도 사진이 없으면 NAVER_CLIENT_ID/NAVER_CLIENT_SECRET(선택)이 있을 때 쇼핑 검색 API 에서 상품번호가 같은 상품의 사진을 씀
    store_min_interval_seconds: 3
    store_retry_attempts: 3
    store_retry_backoff_seconds: 2
    store_max_wait_seconds: 30   # Retry-After 가 이보다 길면 기다리지 않고 사진 없이 (그 시각까지 스토어에 안 감)
    # 이 서버에서 스토어는 거의 늘 429: 재시도까지 다 막힌 판이 2번 연속이면 스토어 전체를 10분 쉬고, 또 막히면 20분·40분… 최대 2시간 (열리면 처음으로)
    store_breaker_after: 2
    store_breaker_seconds: 600
    store_breaker_max_seconds: 7200
    store_cache_seconds: 300     # 읽은 스토어 페이지를 5분 기억 (수집·정품 확인·발행 사진이 같은 페이지를 다시 안 읽음)
    # 그래도 사진이 없으면 발행 직전에만 실제 크롬(로그인 없는 빈 창)으로 한 번 열어 상품 사진을 읽음 (주인 결정 10/10, 일반 요청은 429 여도 크롬은 열림)
    store_browser: true
    store_browser_min_interval_seconds: 60
    store_browser_min_free_mb: 500    # 서버 여유 메모리가 이보다 적으면 안 엶 (블로그 크롬이 떠 있을 때 등)
    store_browser_timeout_seconds: 45
  # 정품·공식 판매처 확인 (필수 기준). 병행수입·구매대행·리퍼 같은 표시가 제목·게시글·상품 페이지 어디에든 있으면 올리지 않음.
  # 오픈마켓(open_markets) 딜은 제목·게시글·판매자명에 공식 표시(official_markers)가 있어야 자동으로 올리고,
  # 없으면 unverified_action 대로: review = 관리자 챗에 "🔎 정품 확인 필요" 를 보내 /ok 후 올림 / skip = 안 올림 / allow = 그냥 올림.
  # 공식 몰(올리브영·컬리·LF몰 등)과 쿠팡은 병행수입 표시만 없으면 통과. 링크를 직접 만드는 몰(토스·네이버)은 링크 요청 메시지에 확인 문구가 붙음.
  authenticity:
    enabled: true
    unverified_action: skip        # 오픈마켓인데 공식 판매처 확인이 안 되면: skip = 묻지 않고 제외 / review = 관리자 확인(/ok) 후 올림 / allow = 그냥 올림
    trusted_reviews: 100         # 후기가 이만큼 쌓인 상품은 공식 표시가 없어도 통과 (0 = 안 씀)
    coupang_min_reviews: 30      # 쿠팡은 판매자를 못 가리므로 후기 양으로: 후기 수를 알았는데 이보다 적으면 안 올림 (모르면 통과, 0 = 안 씀)
    open_markets: [gmarket, auction, 11st, lotteon, ssg, aliexpress, temu, ohouse, naver, toss]
    official_markers: [공식, 브랜드관, 브랜드 스토어, 브랜드스토어, 본사, 직영, official store, official]
    reject_keywords: [병행수입, 병행 수입, 병행, 구매대행, 해외구매대행, 리퍼, 리퍼비시, 리퍼상품, 리퍼제품, 리퍼폰, 중고, 중고품, 중고상품, 벌크, 벌크포장, 전시상품, 전시품, 반품상품, 박스훼손, 짝퉁, 이미테이션, 레플리카, 스크래치]
  # 식품류는 평소 가격(쿠팡 시중가·30일 평균) 대비 50% 이상 쌀 때만 특가 (표시 할인율·추천 수만으로는 안 올림). 그 외 상품은 기존 기준
  food:
    enabled: true
    min_below_reference_pct: 50
    # categories / keywords 기본값은 코드에 있음 (식품·음료·건강식품 분류, 즙·라면·커피·고기… 낱말). 늘리려면 여기에 적으면 됨
  # 후기 수 기준: 상품 페이지에서 후기 수를 읽었는데 이보다 적으면 제외 (후기 수를 못 읽은 상품은 통과)
  quality:
    enabled: true
    min_review_count: 10
    shops: []                  # 비우면 전체 쇼핑몰
  require_shop_url: true       # 원본 주소가 쇼핑몰이 아니라 게시판 글이면(링크 못 찾은 이벤트 글 등) 링크 요청 없이 건너뜀
  # 0) 관심도 게이트: 전 상품을 대조할 수 없으니, 사람들이 관심 있어 보이는 딜만 판정 대상으로.
  #    아래 중 하나라도 넘으면 통과 (값이 없는 신호는 무시). manual/adpick 소스는 항상 통과.
  interest:
    enabled: true
    min_recommend: 1           # 커뮤니티 추천
    min_comments: 3            # 커뮤니티 댓글
    min_views: 500             # 커뮤니티 조회수
    max_rank: 30               # 골드박스/카테고리 베스트 순위
    # 게이트 없이 통과시킬 수집기 이름. 골드박스는 쿠팡이 고른 타임딜 25~28개뿐이고 응답에 순위 칸이 없을 수 있어
    # (10/14: 정가·할인율 칸도 없었음) 순위 대신 가격 근거(네이버 최저가·가격 이력)로만 판정
    always_pass_sources: [manual, adpick, ruliweb_biz, goldbox]
  # (d) 시중가 대조 = 기본 규칙: 다른 몰의 딜을 쿠팡 검색으로 찾은 같은 상품 가격과 비교 (쿠팡 API 키 필요)
  market:
    enabled: true
    min_below_market_pct: 20     # 쿠팡 검색 최저가보다 최소 20% 이상 싸야 특가
    strict: true                 # 대조 결과가 있으면 20% 미만은 무조건 탈락 (보조 규칙으로 안 넘어감)
    veto_if_not_cheaper: true    # (strict 가 아닐 때) 쿠팡가보다 싸지 않으면 (a)/(c) 로 잡혀도 탈락
    require_for_discount_rule: true  # 대조가 가능한 환경이면 (a) 표시 할인율만으로는 통과 못 함
    max_checks_per_hour: 3       # 쿠팡 검색 API 호출 (전체 예산 10회 안에서)
    cache_hours: 24
    min_token_match: 0.8         # 상품명 토큰 일치 비율 (수량 토큰은 반드시 일치)
    require_first_token: true    # 첫 낱말(대개 브랜드)이 다르면 다른 상품
  # (e) 쿠팡 딜(골드박스·카테고리 베스트)의 네이버 최저가 비교 (주인 결정 10/13 '전부 진행').
  #   네이버 쇼핑 검색(공식 Open API, NAVER_CLIENT_ID/NAVER_CLIENT_SECRET — developers.naver.com 의 검색 API 키)으로
  #   같은 상품의 네이버 최저가를 찾아 쿠팡이 min_below_pct% 이상 싸면 특가, 네이버보다 싸지 않으면 탈락, 그 사이는 가격 이력으로.
  #   같은 상품이 확실할 때만 씀: 수량·용량·묶음 같고 낱말 80%↑·브랜드·모델 번호 일치, 프로·라이트·블랙·기획세트·증정 같은
  #   갈래 말이 양쪽에 같게, 중고·렌탈·구독·해외직구·옵션 목록·부속품·쿠팡 판매글 제외. 헷갈리면 근거 없음
  #   (글에 '네이버 최저가보다 N%' 도 안 씀).
  #   - 'N% 싸요' 근거: 최저가가 확인될 때만 — 가격비교(카탈로그) 상품, 또는 판매처 min_listings 곳 + 낮은 가격순 검색에도 같은 상품
  #   - 탈락: 가격비교 상품 최저가, 또는 판매처 min_listings 곳이 (값 + 배송비 여유) 쿠팡 값 이하일 때만.
  #     판매글 한 곳의 싼 값(싼 옵션·개봉품일 수 있음)으로는 이력 특가를 막지 않음
  #   키가 없거나 401 이면 이 비교만 꺼짐 (로그 한 번, 가격 이력으로만 판정)
  #   10/13 주인 결정: 지금은 끔 (네이버 검색이 API HUB 로 옮겨져 딜봇 키로 쇼핑 검색이 안 됨 — 401). 되면 true 로.
  naver_reference:
    enabled: false
    sources: [goldbox, category_best]
    min_below_pct: 12              # 네이버 최저가보다 12% 이상 싸면 특가
    veto_if_not_cheaper: true      # 네이버 최저가보다 싸지 않으면 탈락
    cache_hours: 24                # 같은 상품은 하루 한 번만 찾음 (못 찾음 포함). 다시 못 찾으면 이 안의 지난 값으로 탈락만 지킴
    price_cache_hours: 6           # 찾은 최저가는 6시간까지만 근거로 (넘으면 다시 찾음)
    # 카테고리 베스트 한 판(3개 x 30 = 90개)도 고르게: 차례는 이미 특가인 상품 → 처음 보는 상품 → 지난 값, 카테고리를 번갈아.
    # 골드박스 2시간마다 ~28회 + 카테고리 3시간마다 45회 → 시간당 평균 30회쯤, 하루 700회쯤 (네이버 허용 25,000회)
    max_lookups_per_run: 45        # 수집 한 판에 검색 호출 수
    max_lookups_per_hour: 90       # 한 시간에 (네이버 허용은 하루 25,000회 — 점잖게)
    run_seconds: 60                # 수집 한 판에 네이버 조회에 쓰는 시간 상한 (뽐뿌 5분 루프를 막지 않게)
    timeout_seconds: 8
    min_listings: 2
    general_shipping_allowance: 3000   # 탈락 판단 때 일반 판매글 값에 더하는 배송비 여유 (네이버 값은 배송비 뺀 값)
    confirm_lowest: true           # 판매글만 맞으면 낮은 가격순으로 한 번 더 찾아 최저가인지 확인 (못 하면 근거로 안 씀)
  min_discount_rate: 50          # (a) 표시 할인율 N% 이상 — 서브 신호. 쿠팡 표시 할인율은 부풀려진 경우가 많아 50 으로
  history_days: 30               # (b) 최근 N일 평균가 기준
  min_below_average_pct: 15      # (b) 평균가 대비 N% 이상 저렴
  new_low_below_avg_pct: 10      # (b') 최근 30일 기록 중 제일 싼 값이면서 평균보다 10% 이상 싸면 특가 (기록 조건은 (b)와 같음)
  min_history_samples: 5         # (b) 평균가 계산에 필요한 최소 관측 횟수
  min_history_days: 3            # (b) 이력이 최소 3일에 걸쳐 쌓였을 때만 '평소 가격'으로 인정
  near_low_pct: 5                # (b) 최근 최저가 +5% 이내일 때만 (평균보다 싸도 최저가보다 비싸면 특가 아님)
  observation_min_gap_hours: 6   # 같은 상품 가격은 6시간에 1번만 기록 (재판정 때 같은 값이 쌓이는 것 방지)
  community_min_recommend: 10    # (c) 가격이 적힌 딜: 커뮤니티 추천 N 이상 …
  recommend_needs_support: true  #     … 그리고 가격 근거(표시 할인율 (a) 또는 평균 대비 5%↓)가 같이 있어야 통과
  support_below_avg_pct: 5
  community_strong_recommend: 30 #     추천 30 이상이면(커뮤니티가 검증) 가격 근거 없이도 인정
  discount_alone: false          # (a) 표시 할인율 단독 통과 금지 (쇼핑몰 정가 부풀리기) — 골드박스만 위 per_source 로 허용
  coupon_min_recommend: 20       # 가격 없는 쿠폰/이벤트/공지: 노이즈가 많아 기준을 높게
  accept_coupons_and_events: false # 가격 없는 쿠폰/이벤트/공지 글은 올리지 않음 (true 로 바꾸면 추천 수(coupon_min_recommend)로 판정해 발행)
                                   # 가격이 적힌 딜은 제목에 '이벤트/증정' 이 있어도 가격 기준으로 그대로 판정
  min_price: 5000                # 5천 원 미만 소모품(위생장갑·필름·케이스 등)은 특가 의미가 작아 제외
  # 핫딜이 아닌 분야: 숙박·여행·티켓, 휴대폰 본체(자급제), 게임 타이틀, 리퍼·중고
  exclude_keywords: ["객실", "더블룸", "트윈룸", "스탠다드룸", "슈페리어", "디럭스룸", "호텔", "리조트", "펜션", "숙박", "항공권",
                     "입장권", "이용권", "자급제", "게임 타이틀", "PS5 타이틀", "닌텐도 스위치 타이틀", "리퍼", "중고", "전시상품"]

# ----------------------------------------------------------------------------
# 발행 (텔레그램 채널)
# ----------------------------------------------------------------------------
publish:
  enabled: true
  dry_run: false
  max_per_hour: 12               # 시간당 최대 발행 (딜이 몰리는 시간대 병목 방지)
  max_per_day: 80
  min_interval_seconds: 60       # 발행 간 최소 간격
  dedup_days: 7
  # 이름이 거의 같은 상품(다른 게시판·주소 변형)은 같은 딜로 보고 안 올림 (0~1, 0 이면 끔). 숫자(모델·용량·수량)가 다르면 다른 상품.
  # 전에 올린 것보다 dedupe_cheaper_pct% 이상 싸졌으면 새 딜로 인정
  dedupe_similarity: 0.8
  dedupe_cheaper_pct: 10
  # 글의 강조 단계: 평소 가격(30일 평균·쿠팡 시중가) 대비 50% 이상 싸면 "꼭 담으세요", 70% 이상이면 "역대급". 그 미만은 짧게만
  emphasis_must_pct: 50
  emphasis_top_pct: 70
  queue_ttl_hours: 6             # 자동 발행 대기 항목 유효 시간
  manual_link_ttl_hours: 12      # 내 링크 입력을 기다리는 항목 유효 시간
  max_publish_attempts: 3
  publisher_tick_seconds: 20
  send_photo: true
  quiet_hours: "00:00-07:00"     # 이 시간대(한국시간)에는 채널 글을 무음으로 올림 (구독자 알림 없음). 비우면 항상 알림
  max_awaiting_links: 6          # 내 링크 요청이 이 개수 이상 쌓이면 새 요청은 건너뜀 (관리자 챗 폭주 방지). 0 = 제한 없음
  allow_raw_links: false         # 제휴 링크를 못 만드는 쇼핑몰(미등록 몰 포함)은 건너뜀. true 면 수익 없는 원본 링크로라도 발행
                                 # (예외: 쇼핑커넥트에 없는 네이버 딜은 이 값과 상관없이 원본 주소로 — 위 autolink)
  templates_dir: templates
  template: deal_post.j2
  # 한줄평: 서버의 Claude Code 로그인(구독)으로 상품마다 '누구에게 좋은지' 1~2문장. 숫자·효능 같은 사실은 못 쓰게 막음
  commentary:
    enabled: true                # 모델은 여기 두지 않음: 서버 .env 의 DEALBOT_MODEL_COMMENTARY (없으면 CLI 기본 모델)
    timeout_seconds: 90

# 스레드 자동 발행 (THREADS_APP_ID/SECRET 필요, /threadsauth 로 최초 1회 연결)
threads:
  enabled: true    # 2026-10-12 주인: 차단 풀림 확인(/threadstest 성공, @oneul_hot_deal) → 다시 켬. 웹 승인 로그인이 돌면 /threadstoken 으로 연결
  template: deal_threads.j2               # 한 글: 상황 첫 줄 → 이름·가격 → 비교 금액 → 한마디 → 제휴 고지 → 링크(본문)
  reply_template: null                    # 답글 안 담 (링크는 본문에). 채널 안내 답글을 달려면 deal_threads_reply.j2
  send_photo: true
  refresh_before_days: 7

# 인스타그램 자동 게시 (Instagram API with Instagram Login — 프로페셔널 계정, 페이스북 페이지 불필요)
# Railway Variables: INSTAGRAM_APP_ID, INSTAGRAM_APP_SECRET → /instaauth 로 1회 연결. 사진은 아래 card 로 만든 카드를 올림
instagram:
  enabled: true
  template: deal_instagram.j2
  refresh_before_days: 7
  info_posts: false                       # 정보 글(이벤트류)은 안 올림 (상품 딜만)
  style: B                                # 카드·본문 양식: current | A 사진+큰 가격 | B 저장각 정보 카드 | C 사진+가격 스티커 (주인 선택 10/12: B, 채널 딜 전부 올림)
  no_photo: skip                          # 확인된 상품 사진이 없는 딜: skip(인스타엔 안 올림, 기록만) | text_card(글자 카드로 올림). 로고는 절대 안 씀

# 딜 카드 이미지 (1080×1350). 인스타그램만 (사진은 텔레그램 글과 같은 확인된 상품 사진만)
card:
  enabled: true
  footer: 오늘의 핫딜
  footer_note: 구매 링크는 프로필 링크에서
  keep_days: 7

# 봇의 작은 웹 서버 (Railway 공개 도메인). "/" 는 최근 채널 딜 목록 페이지 — 인스타 프로필 링크에 넣는 용도
web:
  public_page: true
  site_title: 오늘의 핫딜
  page_hours: 48
  page_max_items: 30                      # instagram.style current 일 때만 (점수 순 상위). A/B/C 는 기간 안의 딜을 모두 번호 순으로

# API 가 없어 복붙해야 하는 곳: 발행 성공 시 관리자 챗으로 완성된 문구를 보냄
# 꺼 둠: 블로그(demiyum)는 Blog-Auto 가 자동 발행하고, 오픈채팅용은 블로그 글마다 카톡 '나에게 보내기'로 감
copy:
  enabled: false
  targets:
    - { key: kakao, name: 카카오 오픈채팅, template: deal_kakao.j2, enabled: true }
    - { key: blog, name: 네이버 블로그, template: deal_blog.j2, enabled: true }

links:
  always_deeplink: false
  resolve_short_links: true
  provider_error_cooldown_hours: 12  # 링크프라이스 링크 생성 실패한 몰(승인 전 머천트 등)은 이 시간 동안 건너뜀 (알림도 그때 1번). 0 = 매번 시도

# 정보 글: 상품 링크가 없는 게시판 글(이벤트·결제 할인 공지 등)을 본문·사진만 정리해 올림. 수익 링크는 없음
info_posts:
  enabled: true
  min_recommend: 5             # 커뮤니티 추천 수가 이 값 이상인 글만
  max_per_day: 10
  max_chars: 500               # 본문 정리 길이
  send_photo: true             # 원문에 사진이 있으면 봇이 받아서 같이 올림
  template: info_post.j2       # 텔레그램 양식
  kakao_template: info_kakao.j2
  threads_template: info_threads.j2
  # 올리기 전 확인: auto = 요약이 만들어지면 바로 올리고, 못 만들거나 본문 위치가 불확실하면 관리자 챗에 "정보 글 확인 #번호" 를 보내 /ok 를 기다림
  #                always = 정보 글은 항상 확인 후 올림 / never = 확인 없이 정리한 원문을 그대로 올림 (비추천)
  review: auto
  # 이벤트성 글은 혜택이 이만큼은 돼야 올림: 할인율 40% 이상 또는 할인·적립 금액 5,000원 이상 (둘 중 하나. 0 이면 그 기준은 안 봄)
  min_discount_rate: 40
  min_discount_amount: 5000
  summarizer:                  # 게시판 글을 채널 양식(한 줄 요약 + '·' 항목)으로 다시 쓰기. ANTHROPIC_API_KEY 가 있으면 API, 없으면 서버 claude 로그인(CLI)
    enabled: true              # API 모델은 여기 두지 않음: 서버 .env 의 DEALBOT_MODEL_SUMMARIZER (없으면 API 건너뛰고 CLI 로)
    raw_chars: 4000            # 요약기에 넘기는 원문 최대 길이
    timeout_seconds: 60

# 하루치 발행 딜을 모아 밤에 블로그 글 한 편(복붙용)으로 관리자 챗에 보냄. /blog 로 지금까지 모인 것을 미리 만들어 볼 수 있음
# 꺼 둠: 블로그는 Blog-Auto 가 딜봇이 올린 딜(published_deals.jsonl)로 자동 발행 (/blog 로 미리보기는 그대로 가능)
blog_digest:
  enabled: false
  time: "21:30"
  template: blog_daily.j2
  max_items: 10                # 글 하나에 넣는 최대 딜 수 (점수 높은 순)
  min_items: 1                 # 이보다 적으면 안 보냄
  include_info: true           # 정보 글(이벤트)도 넣음 (정리된 본문이 있는 것만)
  max_info_items: 3
  blog_name: "Deren의 아카이브" # 도입부 "OO를 운영하고 있는 OO입니다"
  author: "Deren"
  extra_channel_lines: []      # 채널 안내·서명에 핫딜 방 다음으로 덧붙일 줄. 예) - "- 텔레그램 · Deren의 쌀농사방\nhttps://t.me/Derens_tip"
  always_disclosures:          # 글마다 반드시 넣는 고지 문구 (쿠팡 딜이 없는 날도)
    - "이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다."

# 내 채널 주소. 글 하단에 서로 연결하는 줄을 넣는다 (비우면 그 줄은 빠짐)
channels:
  telegram_url: "https://t.me/hot_deal_and_info"
  kakao_openchat_url: "https://open.kakao.com/o/pHi1MkMi"
  threads_url: "https://www.threads.net/@oneul_hot_deal"
  telegram_name: "오늘의 핫딜"          # 블로그 글의 채널 안내에 쓰는 이름 ("텔레그램 · 오늘의 핫딜")
  kakao_openchat_name: "오늘의 핫딜 오픈채팅"

# ----------------------------------------------------------------------------
# 모니터링 (관리자 개인 챗)
# ----------------------------------------------------------------------------
monitoring:
  # 휴대폰 푸시 (NTFY_TOPIC 또는 PUSHOVER_* 가 .env 에 있으면 자동 사용)
  push:
    provider: auto             # auto | ntfy | pushover | none
    events: []                 # 주인 결정 10/11: 휴대폰 푸시 대신 카톡 (manual_link | info_review | publish_failed | error | daily_summary | startup)
    ntfy_url: https://ntfy.sh
  notify_on_publish: false           # 채널에 올릴 때마다 오던 '✅ 채널에 올렸습니다' 알림 끔 (카톡 복붙 문구는 그대로 옴)
  notify_on_failure: true
  notify_failure_attempts: false  # 재시도 중 실패(⚠️)는 조용히, 최종 포기(❌)만 알림
  notify_on_error: true
  notify_on_manual_link: true    # 토스/네이버 등 수동 링크가 필요할 때 알림
  kakao_relay: true              # 주인이 해야 할 일(링크 요청·확인·고장)을 카카오톡 '나에게 보내기'로 (Blog-Auto 가 보냄 · 카톡 연결은 /kakao)
  telegram_silent: true          # 주인 결정 10/11: 관리자 챗 알림은 소리 없이 (할 일은 카톡, 카톡이 안 되면 텔레그램으로 소리 내서). 명령 답장은 그대로
  owner_summary_time: "20:50"    # 저녁 요약(카톡)에 넣을 딜봇 하루 정리를 Blog-Auto 에 넘기는 시각
  error_alert_cooldown_minutes: 30
  daily_summary: false           # 매일 21:00 하루 요약 끔 (/status 로 언제든 볼 수 있음). 켜려면 true
  daily_summary_time: "21:00"
  quiet_notices: false           # false: 시작/미리보기/발행 알림도 소리·진동과 함께 (true 면 무음)
  nl_router:                      # 말 명령: 명령어 대신 "675번 올리지 마"처럼 말로 (false 면 예전 그대로)
    enabled: true
    timeout_seconds: 30
    confidence: 0.75               # 확신이 이보다 낮으면 실행하지 않고 물어봄
  heartbeat_minutes: 0             # 0 = '정상 가동 중' 생존 보고 끔 (에러·요청만 받음). N 이면 관리자 챗이 N분 조용할 때 보고

# ----------------------------------------------------------------------------
# 채널 대시보드 (주인 요청 10/14): https://<공개 도메인>/dashboard 에서 구독자·이웃·조회수·목표를 한 화면에
# 비밀번호: 서버 .env 의 DASHBOARD_USER / DASHBOARD_PASSWORD (bash deploy/lightsail/setenv.sh DASHBOARD_PASSWORD,
#   12자 이상·영문·숫자·-_. 만). 너무 많이 틀리면 잠시 429 로 막힘 (docs/DASHBOARD.md).
#   둘 중 하나라도 없으면 페이지는 꺼짐(404) — 숫자 모으기는 enabled 면 계속.
# 카드 추가(새 SNS): src/dealbot/dashboard/sources/ 에 모듈 하나 + 아래 cards 에 한 줄 (docs/DASHBOARD.md)
# 카드 순서 = 아래 적은 순서. goals 는 목표 줄의 목표값 (바꿔도 됨), 빼면 그 줄이 없어짐
# 네이버 블로그 이웃 수·방문자는 robots.txt 가 막은 통계 페이지를 읽지 않고, 카드의 입력 칸으로 직접 넣는다
# ----------------------------------------------------------------------------
dashboard:
  enabled: true
  title: 채널 대시보드
  collect_times: ["09:00", "13:00", "18:00", "22:00"]   # API 카드(텔레그램·인스타·스레드·쿠팡)를 읽는 시각 (한국시간)
  export_interval_minutes: 60      # Blog-Auto 활동 기록·봇 DB 카드를 다시 저장하는 간격 (페이지를 열 때도 읽음)
  refresh_min_minutes: 10          # '다시 읽기' 버튼은 카드마다 10분에 한 번
  spark_days: 28                   # 작은 추이 그래프 기간
  manual_max_days_back: 60         # 직접 입력 날짜는 오늘부터 60일 전까지
  blogauto_metrics_path: /home/ubuntu/Blog-Auto/var/metrics/blogauto.json   # Blog-Auto 가 한 시간마다 쓰는 활동 기록
  blogauto_stale_hours: 3          # 이보다 오래된 기록이면 블로그 활동은 '판단 불가'
  cards:
    - key: telegram
      type: telegram
      title: 텔레그램 채널
      goals: { subscribers: 1000 }          # 구독자 목표
    - key: instagram
      type: instagram
      title: 인스타그램
      goals: { followers: 1000, posts: 100 }  # 팔로워·게시물 목표. 조회수는 인사이트 권한이 있는 토큰일 때만 보임
    - key: threads
      type: threads
      title: 스레드
      goals: { followers: 1000 }            # 팔로워·프로필 조회는 인사이트 권한(threads_manage_insights)이 있을 때만 보임
    - key: blog_finance
      type: naver_blog
      title: Deren의 아카이브
      goals: { open_days: 90, posts: 50, avg_visitors: 100 }   # 네이버 애드포스트 권장 기준 (개설 90일·글 50개·일평균 방문자 100명)
      options:
        blog: finance                       # Blog-Auto 블로그 이름
        blog_id: derenlog
        open_date: null                     # 블로그 개설일 (예: 2026-09-01) — 블로그 관리에서 확인해 적으면 '개설 기간' 이 채워짐
                                            # 게시글 수는 카드에서 한 번 넣어 두면 손으로 쓴 예전 글까지 셈 (뒤로는 봇 발행만큼 더함)
    - key: blog_issue
      type: naver_blog
      title: Deren's Pick
      goals: { open_days: 90, posts: 50, avg_visitors: 100 }
      options:
        blog: issue
        blog_id: derenpick
        open_date: null
    - key: blog_hotdeal
      type: naver_blog
      title: 오늘의 핫딜 블로그
      goals: { open_days: 90, posts: 50, avg_visitors: 100 }
      options:
        blog: hotdeal
        blog_id: demiyum
        open_date: null
    - key: kakao
      type: kakao_openchat
      title: 카카오 오픈채팅
      goals: { members: 300 }               # 참여자 목표 (직접 입력)
    - key: coupang
      type: coupang_partners
      title: 쿠팡 파트너스
      goals: { commission_month: 10000 }    # 이번 달 수익 목표 (원). 파트너스 지급 기준을 확인해 바꿔도 됨
      options:
        max_calls_per_day: 6                # 리포트 API 는 하루 이만큼만 (한 번 읽을 때 3회: 클릭·주문·수익, 재시도 없음, 어제까지)
        min_interval_hours: 8               # 읽는 시각이 와도 이 간격 안이면 건너뜀 (09시·18시쯤 하루 두 번)
    - key: dealbot
      type: dealbot
      title: 핫딜 봇 운영
      goals: { deals_per_day: 10, links_waiting_max: 3 }   # 하루 올린 딜 목표, 내 링크를 기다리는 딜은 3개 이하

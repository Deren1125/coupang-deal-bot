# ============================================================================
# coupang-deal-bot 설정 파일
# 비밀값(API 키, 토큰)은 여기에 쓰지 말고 .env / 환경변수로 관리합니다.
# 값을 바꾼 뒤에는 봇을 재시작하세요.
# ============================================================================

app:
  timezone: Asia/Seoul
  log_level: INFO            # DEBUG | INFO | WARNING | ERROR
  scheduler_tick_seconds: 30 # 수집 스케줄러가 "실행할 때가 됐나" 확인하는 주기
  prune_price_history_days: 180  # 이보다 오래된 가격 이력은 정리
  prune_events_days: 30

http:
  timeout_seconds: 20
  max_retries: 3             # 네트워크/5xx 오류 시 재시도 횟수
  retry_backoff_seconds: 2   # 재시도 간격(지수 증가: 2s, 4s, 8s ...)
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

# ----------------------------------------------------------------------------
# 수집기(플러그인). type 은 내장 수집기 이름이거나 "패키지.모듈:클래스" 경로.
# 내장: coupang_goldbox | coupang_category_best | ppomppu
# ----------------------------------------------------------------------------
collectors:
  - name: goldbox
    type: coupang_goldbox
    enabled: true
    interval_minutes: 60
    options:
      limit: 50
      image_size: "512x512"

  - name: category_best
    type: coupang_category_best
    enabled: true
    interval_minutes: 180
    options:
      limit: 30
      # 쿠팡 카테고리 ID (파트너스 API 문서 기준)
      # 1001 여성패션  1002 남성패션  1010 뷰티        1011 출산/유아동  1012 식품
      # 1013 주방용품  1014 생활용품  1015 홈인테리어  1016 가전디지털   1017 스포츠/레저
      # 1018 자동차용품 1019 도서/음반 1020 완구/취미  1021 문구/오피스  1024 헬스/건강식품
      # 1025 국내여행  1026 해외여행  1029 반려동물용품 1030 유아동패션
      category_ids: [1016, 1012, 1014, 1010]
      image_size: "512x512"
      delay_between_categories_seconds: 3

  - name: ppomppu
    type: ppomppu
    enabled: true
    interval_minutes: 20
    options:
      board_id: ppomppu          # 뽐뿌 핫딜 게시판 id (zboard.php?id=ppomppu)
      pages: 1                   # 목록 몇 페이지까지 볼지
      shop_keywords: ["쿠팡"]     # 제목에 이 단어가 있는 글만 수집
      request_delay_seconds: 2   # 글 상세 페이지 요청 간 간격(서버 배려)
      max_detail_fetch_per_run: 15
      # 사이트 구조가 바뀌면 아래 셀렉터만 고치면 됩니다.
      list_row_selector: "tr.baseList"
      title_selector: "a.baseList-title"
      thumb_selector: "img"

# ----------------------------------------------------------------------------
# 특가 판정 규칙: (a) 또는 (b) 중 하나만 만족하면 특가
# ----------------------------------------------------------------------------
deal:
  min_discount_rate: 30          # (a) 표시 할인율 N% 이상
  history_days: 30               # (b) 최근 N일 평균가 기준
  min_below_average_pct: 15      # (b) 평균가 대비 N% 이상 저렴
  min_history_samples: 3         # (b) 평균가 계산에 필요한 최소 관측 횟수 (오판 방지)
  min_price: 1000                # 이 금액 미만 상품은 무시
  exclude_keywords: []           # 상품명에 포함되면 제외 (예: ["리퍼", "중고"])

# ----------------------------------------------------------------------------
# 발행 (텔레그램 채널)
# ----------------------------------------------------------------------------
publish:
  enabled: true
  dry_run: false                 # true 면 실제 전송 없이 로그만 (환경변수 DEALBOT_DRY_RUN 으로도 설정 가능)
  max_per_hour: 6                # 시간당 최대 발행 수 (파트너스 약관/스팸 리스크 관리)
  max_per_day: 40                # 24시간 최대 발행 수
  min_interval_seconds: 180      # 연속 발행 최소 간격
  dedup_days: 7                  # 이미 올린 상품은 N일 동안 다시 올리지 않음
  queue_ttl_hours: 6             # 대기열에서 N시간 넘게 못 나간 특가는 만료 처리
  max_publish_attempts: 3        # 발행 실패 시 재시도 횟수
  publisher_tick_seconds: 20     # 대기열 확인 주기
  send_photo: true               # 이미지와 함께 발행 (실패 시 텍스트로 자동 대체)
  templates_dir: templates
  template: deal_post.j2

# ----------------------------------------------------------------------------
# 링크 변환
# ----------------------------------------------------------------------------
links:
  always_deeplink: false         # true 면 API가 준 파트너스 링크도 항상 딥링크(short URL)로 재변환
  resolve_short_links: true      # link.coupang.com/a/xxx 형태(타인 링크)를 원본 상품 URL로 풀어서 내 링크로 변환

# ----------------------------------------------------------------------------
# 모니터링 (관리자 개인 챗)
# ----------------------------------------------------------------------------
monitoring:
  notify_on_publish: true        # 발행 성공 시 알림
  notify_on_failure: true        # 발행 실패 시 알림
  notify_on_error: true          # 수집/기타 에러 알림
  error_alert_cooldown_minutes: 30   # 같은 종류의 에러 알림은 N분에 1번만
  daily_summary_time: "21:00"    # 일일 요약 전송 시각 (timezone 기준)
